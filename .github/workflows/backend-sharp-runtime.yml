name: Backend Sharp Runtime Validation

on:
  push:
    branches:
      - backend-sharp-runtime-fix

permissions:
  contents: write

jobs:
  pin-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backend-sharp-runtime-fix

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Pin known-good sharp runtime
        working-directory: backend
        run: npm install --save-exact --package-lock-only --ignore-scripts sharp@0.34.5

      - name: Guard sharp Dependabot upgrades
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = '.github/dependabot.yml';
          let text = fs.readFileSync(path, 'utf8');
          if (!text.includes('dependency-name: "sharp"')) {
            text = text.replace(
              '    groups:\n',
              '    ignore:\n      - dependency-name: "sharp"\n        update-types:\n          - "version-update:semver-minor"\n          - "version-update:semver-major"\n    groups:\n',
            );
            fs.writeFileSync(path, text);
          }
          NODE

      - name: Assert dependency contract
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('backend/package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('backend/package-lock.json', 'utf8'));
          if (pkg.dependencies?.sharp !== '0.34.5') throw new Error(`Expected sharp 0.34.5, got ${pkg.dependencies?.sharp}`);
          if (lock.packages?.['']?.dependencies?.sharp !== '0.34.5') throw new Error(`Lock root sharp mismatch: ${lock.packages?.['']?.dependencies?.sharp}`);
          if (lock.packages?.['node_modules/sharp']?.version !== '0.34.5') throw new Error(`Resolved sharp mismatch: ${lock.packages?.['node_modules/sharp']?.version}`);
          NODE

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --include=optional

      - name: Smoke-load sharp on Linux
        working-directory: backend
        run: node -e "const sharp=require('sharp'); console.log('sharp', sharp.versions.sharp, 'vips', sharp.versions.vips)"

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Test backend
        working-directory: backend
        run: npm test

      - name: Audit production dependencies
        working-directory: backend
        run: npm audit --omit=dev --audit-level=critical

      - name: Remove one-time workflow
        run: rm .github/workflows/backend-sharp-runtime.yml

      - name: Commit validated runtime pin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package.json backend/package-lock.json .github/dependabot.yml .github/workflows/backend-sharp-runtime.yml
          git diff --cached --check
          git commit -m "fix(backend): restore Vercel-compatible sharp runtime"
          git push origin HEAD:backend-sharp-runtime-fix
