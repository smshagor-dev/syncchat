name: Flutter Mobile CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-mobile-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-mobile-ci.yml'

permissions:
  contents: write

concurrency:
  group: flutter-mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply chat room compile patch
        if: github.ref_name == 'fix/mobile-chatroom-exact-web-parity'
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/screens/live_chat_room_web_parity_screen.dart')
          text = path.read_text()
          text = text.replace(
              "child: SizedBox(\n                    constraints: const BoxConstraints(minHeight: 44),\n                    child: TextField(",
              "child: ConstrainedBox(\n                    constraints: const BoxConstraints(minHeight: 44),\n                    child: TextField(",
          )
          text = text.replace(
              "child: Container(\n        minHeight: 44,\n        padding: const EdgeInsets.symmetric(horizontal: 12),",
              "child: Container(\n        constraints: const BoxConstraints(minHeight: 44),\n        padding: const EdgeInsets.symmetric(horizontal: 12),",
          )
          text = text.replace(
              "case 'info':\n        case 'security':\n          await _openRoomInfo();\n          break;",
              "case 'info':\n          await _openRoomInfo();\n          break;\n        case 'security':\n          await _showE2ee();\n          break;",
          )
          path.write_text(text)
          PY
          if git diff --quiet; then
            echo "No patch needed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/screens/live_chat_room_web_parity_screen.dart
            git commit -m "chore(chatroom): apply compile patch"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test
