name: SyncChat Mobile Demo Release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/mobile-demo-release.yml'
    tags:
      - 'mobile-v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: mobile-v0.1.0-demo.2
  RELEASE_TITLE: SyncChat Mobile Demo v0.1.0 Demo 2

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Test
        working-directory: mobile
        run: flutter test

      - name: Build online demo APK
        working-directory: mobile
        run: |
          flutter build apk --release \
            --dart-define=SYNCCHAT_API_BASE_URL=https://api.syncchat.live/api \
            --dart-define=SYNCCHAT_SOCKET_URL=https://api.syncchat.live \
            --dart-define=SYNCCHAT_APP_VERSION=${RELEASE_TAG} \
            --dart-define=SYNCCHAT_FIREBASE_API_KEY=${{ secrets.SYNCCHAT_FIREBASE_API_KEY }} \
            --dart-define=SYNCCHAT_FIREBASE_APP_ID=${{ secrets.SYNCCHAT_FIREBASE_APP_ID }} \
            --dart-define=SYNCCHAT_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.SYNCCHAT_FIREBASE_MESSAGING_SENDER_ID }} \
            --dart-define=SYNCCHAT_FIREBASE_PROJECT_ID=${{ secrets.SYNCCHAT_FIREBASE_PROJECT_ID }}

      - name: Prepare release files
        run: |
          mkdir -p release
          cp mobile/build/app/outputs/flutter-apk/app-release.apk "release/SyncChat-Mobile-Demo-${RELEASE_TAG}.apk"
          sha256sum "release/SyncChat-Mobile-Demo-${RELEASE_TAG}.apk" > "release/SyncChat-Mobile-Demo-${RELEASE_TAG}.apk.sha256"
          cat > release/RELEASE_NOTES.md <<EOF
          # ${RELEASE_TITLE}

          Android demo build connected to the production SyncChat API and Socket.IO service.

          This build includes camera-based QR device login, phonebook contact sync and new-contact support, message/settings parity, production Firebase configuration, the supplied SyncChat app logo, realtime messaging, media and voice notes, device E2EE text messaging, native notifications/incoming-call wake, and WhatsApp-style WebRTC/LiveKit calling with draggable self-video and camera switching.

          The APK uses the repository demo signing configuration and is intended for direct testing outside Google Play. Native Firebase call-push features require the repository Firebase client secrets to be configured at build time.
          EOF

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: syncchat-mobile-demo-${{ env.RELEASE_TAG }}
          path: |
            release/*.apk
            release/*.sha256
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/*.apk release/*.sha256 --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" \
              release/*.apk release/*.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file release/RELEASE_NOTES.md \
              --prerelease
          fi
