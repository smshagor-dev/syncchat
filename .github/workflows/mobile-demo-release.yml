# Release trigger: mobile-v0.1.0-demo.5
name: SyncChat Mobile Demo Release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/mobile-demo-release.yml'
    tags:
      - 'mobile-v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: mobile-v0.1.0-demo.5
  RELEASE_TITLE: SyncChat Mobile Demo v0.1.0 Demo 5

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Test
        working-directory: mobile
        run: flutter test

      - name: Validate physical-device startup safety
        working-directory: mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('lib/main.dart').read_text()
          run_app = source.find('runApp(const SyncChatMobileApp());')
          bootstrap = source.find('unawaited(_bootstrapNativeServices());')
          if run_app < 0 or bootstrap < 0 or run_app > bootstrap:
              raise SystemExit('runApp must happen before optional native bootstrap')
          if 'Future<void> main() async' in source:
              raise SystemExit('main must not await native plugins before first frame')
          if '.hasSession().timeout(' not in source:
              raise SystemExit('session restore must be bounded')
          if 'Duration(seconds: 8)' not in source:
              raise SystemExit('native bootstrap timeout guard is missing')
          print('Flutter first-frame startup order: safe')
          PY

      - name: Validate Android launcher resources
        working-directory: mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import struct

          icons = sorted(Path('android/app/src/main/res').glob('mipmap-*/ic_launcher.png'))
          if not icons:
              raise SystemExit('No Android launcher icons found')
          for icon in icons:
              raw = icon.read_bytes()
              if raw[:8] != b'\x89PNG\r\n\x1a\n' or len(raw) < 24:
                  raise SystemExit(f'Invalid PNG: {icon}')
              width, height = struct.unpack('>II', raw[16:24])
              if width < 48 or height < 48:
                  raise SystemExit(f'Launcher icon too small: {icon} ({width}x{height})')
              print(f'{icon}: {width}x{height} PNG')

          required = [
              Path('android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml'),
              Path('android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml'),
              Path('android/app/src/main/res/values/colors.xml'),
          ]
          for path in required:
              if not path.is_file():
                  raise SystemExit(f'Missing adaptive launcher resource: {path}')
              print(f'{path}: present')

          expected = '0bbe448622ad5164eec55ed3584f3b669c8f9be0b908cfe5961a8a1856f88791'
          exact_logo_paths = [
              Path('assets/syncchat_logo.png'),
              Path('android/app/src/main/res/mipmap-xhdpi/ic_launcher.png'),
              Path('android/app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png'),
              Path('android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png'),
              Path('android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png'),
              Path('android/app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png'),
              Path('android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png'),
              Path('android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png'),
              Path('android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png'),
              Path('android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png'),
          ]
          for path in exact_logo_paths:
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest != expected:
                  raise SystemExit(f'Wrong SyncChat logo bytes: {path} ({digest})')
              print(f'{path}: verified SyncChat logo')
          PY
          grep -F 'android:icon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml
          grep -F 'android:roundIcon="@mipmap/ic_launcher_round"' android/app/src/main/AndroidManifest.xml
          grep -F 'version: 0.1.0+4' pubspec.yaml

      - name: Validate release resource settings
        working-directory: mobile
        run: grep -F 'isCrunchPngs = false' android/app/build.gradle.kts

      - name: Build online demo APK
        working-directory: mobile
        run: |
          flutter build apk --release \
            --dart-define=SYNCCHAT_API_BASE_URL=https://api.syncchat.live/api \
            --dart-define=SYNCCHAT_SOCKET_URL=https://api.syncchat.live \
            --dart-define=SYNCCHAT_APP_VERSION=${RELEASE_TAG}

      - name: Verify packaged Android launcher resources
        working-directory: mobile
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          AAPT2=$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -1)
          test -x "$AAPT2"
          "$AAPT2" dump resources "$APK" | grep -E 'mipmap/(ic_launcher|ic_launcher_round|ic_launcher_foreground)'

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cold-launch on real Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            cd mobile
            adb shell pm clear com.syncchat.live || true
            flutter test integration_test/cold_launch_test.dart -d emulator-5554 \
              --dart-define=SYNCCHAT_API_BASE_URL=https://api.syncchat.live/api \
              --dart-define=SYNCCHAT_SOCKET_URL=https://api.syncchat.live \
              --dart-define=SYNCCHAT_APP_VERSION=${RELEASE_TAG}

      - name: Prepare release files
        run: |
          mkdir -p release
          cp mobile/build/app/outputs/flutter-apk/app-release.apk "release/SyncChat-Mobile-Demo-${RELEASE_TAG}.apk"
          sha256sum "release/SyncChat-Mobile-Demo-${RELEASE_TAG}.apk" > "release/SyncChat-Mobile-Demo-${RELEASE_TAG}.apk.sha256"
          cat > release/RELEASE_NOTES.md <<EOF
          # ${RELEASE_TITLE}

          Android demo build connected to the production SyncChat API and Socket.IO service.

          Demo 5 is gated by a fresh Android emulator cold-launch integration test that must leave the Android startup screen and reach SyncChat's Flutter Sign in UI within 20 seconds before publication. It retains the runApp-first startup fix, bounded CallKit/Firebase/local-notification bootstrap, and the verified supplied SyncChat logo for high-density legacy, adaptive, foreground and round launcher resources. Android versionCode is 4.

          The APK also includes camera-based QR device login, phonebook contact sync and new-contact support, message/settings parity, realtime messaging, media and voice notes, device E2EE text messaging, Firebase notifications/incoming-call wake, and WhatsApp-style WebRTC/LiveKit calling with draggable self-video and camera switching.

          The APK uses the repository demo signing configuration and is intended for direct testing outside Google Play. Firebase values come from the validated mobile client configuration committed for package com.syncchat.live.
          EOF

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: syncchat-mobile-demo-${{ env.RELEASE_TAG }}
          path: |
            release/*.apk
            release/*.sha256
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/*.apk release/*.sha256 --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" \
              release/*.apk release/*.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file release/RELEASE_NOTES.md \
              --prerelease
          fi
