name: SyncChat Mobile Demo Release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/mobile-demo-release.yml'
    tags:
      - 'mobile-v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: mobile-v0.1.0-demo.2
  RELEASE_TITLE: SyncChat Mobile Demo v0.1.0 Demo 2

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Test
        working-directory: mobile
        run: flutter test

      - name: Validate Android launcher PNGs
        working-directory: mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct

          icons = sorted(Path('android/app/src/main/res').glob('mipmap-*/ic_launcher.png'))
          if not icons:
              raise SystemExit('No Android launcher icons found')
          for icon in icons:
              raw = icon.read_bytes()
              if raw[:8] != b'\x89PNG\r\n\x1a\n' or len(raw) < 24:
                  raise SystemExit(f'Invalid PNG: {icon}')
              width, height = struct.unpack('>II', raw[16:24])
              if width < 48 or height < 48:
                  raise SystemExit(f'Launcher icon too small: {icon} ({width}x{height})')
              print(f'{icon}: {width}x{height} PNG')
          PY

      - name: Build online demo APK
        working-directory: mobile
        run: |
          flutter build apk --release \
            --dart-define=SYNCCHAT_API_BASE_URL=https://api.syncchat.live/api \
            --dart-define=SYNCCHAT_SOCKET_URL=https://api.syncchat.live \
            --dart-define=SYNCCHAT_APP_VERSION=${RELEASE_TAG}

      - name: Prepare release files
        run: |
          mkdir -p release
          cp mobile/build/app/outputs/flutter-apk/app-release.apk "release/SyncChat-Mobile-Demo-${RELEASE_TAG}.apk"
          sha256sum "release/SyncChat-Mobile-Demo-${RELEASE_TAG}.apk" > "release/SyncChat-Mobile-Demo-${RELEASE_TAG}.apk.sha256"
          cat > release/RELEASE_NOTES.md <<EOF
          # ${RELEASE_TITLE}

          Android demo build connected to the production SyncChat API and Socket.IO service.

          This build includes camera-based QR device login, phonebook contact sync and new-contact support, message/settings parity, the supplied SyncChat app logo, realtime messaging, media and voice notes, device E2EE text messaging, Firebase notifications/incoming-call wake, and WhatsApp-style WebRTC/LiveKit calling with draggable self-video and camera switching.

          The APK uses the repository demo signing configuration and is intended for direct testing outside Google Play. Firebase values come from the validated mobile client configuration committed for package com.syncchat.live.
          EOF

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: syncchat-mobile-demo-${{ env.RELEASE_TAG }}
          path: |
            release/*.apk
            release/*.sha256
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/*.apk release/*.sha256 --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" \
              release/*.apk release/*.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file release/RELEASE_NOTES.md \
              --prerelease
          fi
