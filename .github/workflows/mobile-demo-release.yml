# Release trigger: mobile-v0.1.0-demo.5
name: SyncChat Mobile Demo Release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/mobile-demo-release.yml'
      - 'mobile/test_driver/integration_test.dart'
    tags:
      - 'mobile-v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: mobile-v0.1.0-demo.5
  RELEASE_TITLE: SyncChat Mobile Demo v0.1.0 Demo 5

jobs:
  validate-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Test
        working-directory: mobile
        run: flutter test

      - name: Validate physical-device startup safety
        working-directory: mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('lib/main.dart').read_text()
          run_app = source.find('runApp(const SyncChatMobileApp());')
          bootstrap = source.find('unawaited(_bootstrapNativeServices());')
          if run_app < 0 or bootstrap < 0 or run_app > bootstrap:
              raise SystemExit('runApp must happen before optional native bootstrap')
          if 'Future<void> main() async' in source:
              raise SystemExit('main must not await native plugins before first frame')
          if '.hasSession().timeout(' not in source:
              raise SystemExit('session restore must be bounded')
          if 'Duration(seconds: 8)' not in source:
              raise SystemExit('native bootstrap timeout guard is missing')
          print('Flutter first-frame startup order: safe')
          PY

      - name: Free disk space for Android emulator
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          sudo rm -rf /usr/local/lib/android/sdk/system-images || true
          sudo rm -rf /usr/local/lib/android/sdk/ndk/25* /usr/local/lib/android/sdk/ndk/26* /usr/local/lib/android/sdk/ndk/27* /usr/local/lib/android/sdk/ndk/28* /usr/local/lib/android/sdk/ndk/29* || true
          sudo apt-get clean
          df -h /

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cold-launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: cd mobile && flutter drive --driver=test_driver/integration_test.dart --target=integration_test/cold_launch_test.dart -d emulator-5554 --dart-define=SYNCCHAT_API_BASE_URL=https://api.syncchat.live/api --dart-define=SYNCCHAT_SOCKET_URL=https://api.syncchat.live --dart-define=SYNCCHAT_PUBLIC_ORIGIN=https://syncchat.live --dart-define=SYNCCHAT_APP_VERSION=${RELEASE_TAG}

  build-and-publish:
    needs: validate-emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Configure required production signing
        working-directory: mobile
        env:
          KEYSTORE_B64: ${{ secrets.SYNCCHAT_ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SYNCCHAT_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SYNCCHAT_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SYNCCHAT_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Missing SYNCCHAT_ANDROID_KEYSTORE_B64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing SYNCCHAT_ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing SYNCCHAT_ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing SYNCCHAT_ANDROID_KEY_PASSWORD"; exit 1; }
          KEYSTORE_PATH="$RUNNER_TEMP/syncchat-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "SYNCCHAT_ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "SYNCCHAT_ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SYNCCHAT_ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SYNCCHAT_ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Validate Android launcher resources
        working-directory: mobile
        run: |
          test -s assets/syncchat_logo.png
          grep -F 'android:icon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml
          grep -F 'android:roundIcon="@mipmap/ic_launcher_round"' android/app/src/main/AndroidManifest.xml
          grep -F 'version: 0.1.0+4' pubspec.yaml
          grep -F 'isCrunchPngs = false' android/app/build.gradle.kts

      - name: Build online demo APK
        working-directory: mobile
        run: flutter build apk --release --dart-define=SYNCCHAT_API_BASE_URL=https://api.syncchat.live/api --dart-define=SYNCCHAT_SOCKET_URL=https://api.syncchat.live --dart-define=SYNCCHAT_PUBLIC_ORIGIN=https://syncchat.live --dart-define=SYNCCHAT_APP_VERSION=${RELEASE_TAG}

      - name: Verify APK signature
        working-directory: mobile
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Prepare release files
        run: |
          mkdir -p release
          cp mobile/build/app/outputs/flutter-apk/app-release.apk "release/SyncChat-Mobile-Demo-${RELEASE_TAG}.apk"
          sha256sum "release/SyncChat-Mobile-Demo-${RELEASE_TAG}.apk" > "release/SyncChat-Mobile-Demo-${RELEASE_TAG}.apk.sha256"
          cat > release/RELEASE_NOTES.md <<EOF
          # ${RELEASE_TITLE}

          Android demo build connected to the production SyncChat API and Socket.IO service.

          Demo 5 is gated by unit tests, startup-safety validation, a fresh Android emulator cold-launch test, and verified production APK signing. Android versionCode is 4.

          The APK includes QR device login, contact sync, realtime messaging, media and voice notes, device E2EE messaging, Firebase notifications/incoming-call wake, and WebRTC/LiveKit calling.
          EOF

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: syncchat-mobile-demo-${{ env.RELEASE_TAG }}
          path: |
            release/*.apk
            release/*.sha256
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/*.apk release/*.sha256 --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" release/*.apk release/*.sha256 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --notes-file release/RELEASE_NOTES.md --prerelease
          fi
