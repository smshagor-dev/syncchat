name: Flutter Mobile E2EE Integration

on:
  push:
    branches: [flutter-mobile-parity]
    paths:
      - '.github/scripts/integrate_flutter_e2ee.py'
      - '.github/workflows/flutter-mobile-integrate-e2ee.yml'

permissions:
  contents: write

jobs:
  integrate-and-validate:
    if: github.ref == 'refs/heads/flutter-mobile-parity'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: flutter-mobile-parity
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Narrow schedule patch target
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/integrate_flutter_e2ee.py')
          text = path.read_text()
          old = '''# Both schedule call sites should use effectiveInbox.
          if room.count("inbox: widget.inbox,") != 2:
              raise SystemExit(
                  f"schedule effective inbox: expected 2 remaining matches, found {room.count('inbox: widget.inbox,')}"
              )
          room = room.replace("inbox: widget.inbox,", "inbox: effectiveInbox,", 2)'''
          new = '''# Both schedule call sites should use effectiveInbox without touching RoomHeader.
          schedule_needle = "      await chat.scheduleMessage(\\n        inbox: widget.inbox,"
          schedule_replacement = "      await chat.scheduleMessage(\\n        inbox: effectiveInbox,"
          if room.count(schedule_needle) != 2:
              raise SystemExit(
                  f"schedule effective inbox: expected 2 schedule matches, found {room.count(schedule_needle)}"
              )
          room = room.replace(schedule_needle, schedule_replacement, 2)'''
          if text.count(old) != 1:
              raise SystemExit('Could not find the schedule patch safety block')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Integrate E2EE runtime
        run: python3 .github/scripts/integrate_flutter_e2ee.py

      - name: Remove one-time integration files
        run: |
          rm -f .github/scripts/integrate_flutter_e2ee.py
          rm -f .github/workflows/flutter-mobile-integrate-e2ee.yml

      - name: Format
        run: |
          dart format \
            mobile/lib/core/e2ee_service.dart \
            mobile/lib/screens/live_chat_room_screen.dart \
            mobile/lib/screens/forward_message_sheet.dart \
            mobile/test/e2ee_crypto_test.dart

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Test
        working-directory: mobile
        run: flutter test

      - name: Commit integrated E2EE feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile .github/scripts .github/workflows
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat(flutter): integrate device e2ee messaging"
          git push origin HEAD:flutter-mobile-parity
