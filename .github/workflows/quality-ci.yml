name: SyncChat Quality CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/quality-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/quality-ci.yml'

concurrency:
  group: syncchat-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Syntax validation
        run: npm run build
      - name: Backend tests
        run: npm test
      - name: Critical production dependency audit
        run: npm audit --omit=dev --audit-level=critical

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Production build
        env:
          API_BASE_URL: https://api.syncchat.live/api
          SOCKET_URL: https://api.syncchat.live
          PUBLIC_ORIGIN: https://syncchat.live
        run: npm run build
      - name: Critical production dependency audit
        run: npm audit --omit=dev --audit-level=critical
