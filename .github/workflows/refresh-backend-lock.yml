name: Refresh backend lockfile

on:
  push:
    branches:
      - agent/migrate-mysql-to-mongodb

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/migrate-mysql-to-mongodb
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Refresh lockfile
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "refresh backend lockfile"
          git push origin HEAD:agent/migrate-mysql-to-mongodb
