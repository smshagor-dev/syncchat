name: Apply Cache First Realtime Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cache-first-realtime-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch cache-first UI and 500ms API reconciliation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing patch anchor: {label}')
              return text.replace(old, new, 1)

          # Chats list: render encrypted local cache immediately, then socket,
          # then silent API reconciliation. If socket is unavailable, reconcile
          # once after 500ms instead of showing a blocking loader.
          path = Path('mobile/lib/screens/live_p0_chats_screen.dart')
          text = path.read_text()
          if not text.startswith("import 'dart:async';"):
              text = "import 'dart:async';\n\n" + text
          if "../core/realtime_client.dart" not in text:
              text = text.replace(
                  "import '../core/app_scope.dart';\n",
                  "import '../core/app_scope.dart';\nimport '../core/realtime_client.dart';\n",
                  1,
              )
          text = replace_once(
              text,
              "  Map<String, dynamic>? currentUser;\n  bool loading = true;",
              "  Map<String, dynamic>? currentUser;\n  StreamSubscription<RealtimeConnectionState>? connectionSubscription;\n  Timer? apiFallbackTimer;\n  bool loading = false;",
              'chat list state',
          )
          text = replace_once(
              text,
              "    realtime?.off('inbox/chat-lock', _onLockUpdate);\n    search.dispose();",
              "    realtime?.off('inbox/chat-lock', _onLockUpdate);\n    connectionSubscription?.cancel();\n    apiFallbackTimer?.cancel();\n    search.dispose();",
              'chat list dispose',
          )
          old_start = """  Future<void> _start() async {
    final realtime = context.services.realtime;
    realtime.on('inbox/find', _onInboxUpdate);
    realtime.on('inbox/preferences', _onInboxUpdate);
    realtime.on('inbox/delete', _onInboxDelete);
    realtime.on('inbox/chat-lock', _onLockUpdate);
    await _load();
  }

  Future<void> _load() async {
    if (mounted) {
      setState(() {
        loading = true;
        error = null;
      });
    }
"""
          new_start = """  Future<void> _start() async {
    final services = context.services;
    final realtime = services.realtime;
    realtime.on('inbox/find', _onInboxUpdate);
    realtime.on('inbox/preferences', _onInboxUpdate);
    realtime.on('inbox/delete', _onInboxDelete);
    realtime.on('inbox/chat-lock', _onLockUpdate);

    final cachedUser = await services.chatCache.readCurrentUser();
    final cachedInboxes = await services.chatCache.readInboxes();
    if (mounted) {
      setState(() {
        if (cachedUser.isNotEmpty) currentUser = cachedUser;
        if (cachedInboxes.isNotEmpty) inboxes = cachedInboxes;
        loading = false;
      });
    }

    connectionSubscription = realtime.states.listen((state) {
      if (state == RealtimeConnectionState.connected) {
        apiFallbackTimer?.cancel();
        unawaited(_load());
      } else if (state == RealtimeConnectionState.disconnected) {
        _scheduleApiFallback();
      }
    });

    if (realtime.state == RealtimeConnectionState.disconnected) {
      unawaited(realtime.connect());
      _scheduleApiFallback();
    }
    unawaited(_load());
  }

  void _scheduleApiFallback() {
    apiFallbackTimer?.cancel();
    apiFallbackTimer = Timer(const Duration(milliseconds: 500), () {
      if (!mounted) return;
      if (!context.services.realtime.isConnected) unawaited(_load());
    });
  }

  Future<void> _load() async {
    if (mounted) setState(() => error = null);
"""
          text = replace_once(text, old_start, new_start, 'chat list start/load')
          text = text.replace(
              "    if (loading && inboxes.isEmpty) {\n      return const Center(child: CircularProgressIndicator());\n    }\n",
              "",
              1,
          )
          path.write_text(text)

          # Room: cache messages/current user first. Socket catch-up is primary;
          # disconnected socket schedules an HTTP room reconciliation after 500ms.
          path = Path('mobile/lib/screens/live_chat_room_core_screen.dart')
          text = path.read_text()
          text = replace_once(
              text,
              "  Timer? presenceTimer;\n  bool loading = true;",
              "  Timer? presenceTimer;\n  Timer? apiFallbackTimer;\n  bool loading = false;",
              'room state',
          )
          text = replace_once(
              text,
              "    presenceTimer?.cancel();\n    composer.dispose();",
              "    presenceTimer?.cancel();\n    apiFallbackTimer?.cancel();\n    composer.dispose();",
              'room dispose',
          )
          anchor = """    chat.on('e2ee/key-changed', _onE2eeKeyChanged);

    connectionSubscription = services.realtime.states.listen((state) {
"""
          cached = """    chat.on('e2ee/key-changed', _onE2eeKeyChanged);

    final cachedUser = await services.chatCache.readCurrentUser();
    final cachedMessages = await services.chatCache.readRoomMessages(roomId);
    if (mounted) {
      setState(() {
        if (cachedUser.isNotEmpty) currentUser = cachedUser;
        if (cachedMessages.isNotEmpty) _mergeMessages(cachedMessages);
        loading = false;
      });
      if (cachedMessages.isNotEmpty) _scrollToBottom();
    }

    connectionSubscription = services.realtime.states.listen((state) {
"""
          text = replace_once(text, anchor, cached, 'room cache hydration')
          old_listener = """    connectionSubscription = services.realtime.states.listen((state) {
      if (state == RealtimeConnectionState.connected) {
        _catchUp();
        _refreshPresence();
      }
    });
"""
          new_listener = """    connectionSubscription = services.realtime.states.listen((state) {
      if (state == RealtimeConnectionState.connected) {
        apiFallbackTimer?.cancel();
        unawaited(_catchUp());
        unawaited(_refreshPresence());
      } else if (state == RealtimeConnectionState.disconnected) {
        _scheduleApiFallback();
      }
    });
    if (services.realtime.state == RealtimeConnectionState.disconnected) {
      unawaited(services.realtime.connect());
      _scheduleApiFallback();
    }
"""
          text = replace_once(text, old_listener, new_listener, 'room socket listener')
          catchup_anchor = """  Future<void> _catchUp() async {
"""
          fallback_methods = """  void _scheduleApiFallback() {
    apiFallbackTimer?.cancel();
    apiFallbackTimer = Timer(const Duration(milliseconds: 500), () {
      if (!mounted) return;
      if (!context.services.realtime.isConnected) {
        unawaited(_reconcileRoomFromApi());
        unawaited(_refreshPresence());
      }
    });
  }

  Future<void> _reconcileRoomFromApi() async {
    if (!mounted || roomId.isEmpty) return;
    try {
      final rows = await chat.listRoom(roomId, limit: 100);
      if (!mounted) return;
      setState(() {
        _mergeMessages(rows);
        error = null;
      });
      _scrollToBottom();
    } on Object {
      // Cache remains visible. Realtime reconnect will catch up later.
    }
  }

"""
          text = replace_once(text, catchup_anchor, fallback_methods + catchup_anchor, 'room fallback methods')
          text = text.replace(
              "    if (loading) return const Center(child: CircularProgressIndicator());\n",
              "",
              1,
          )
          # Manual refresh should not blank the room while fetching.
          text = text.replace(
              "    setState(() {\n      loading = true;\n      error = null;\n    });\n",
              "    setState(() => error = null);\n",
              1,
          )
          path.write_text(text)

          # The old conflict test expects contextual widgets in the wrapper even
          # though the wrapper now intentionally only enforces locked-chat biometrics.
          path = Path('mobile/test/p0_p1_conflict_resolution_test.dart')
          text = path.read_text()
          old = """  test('chat entry keeps the refactored contextual parity layer', () {
    final source = File('lib/screens/live_chat_room_screen.dart').readAsStringSync();

    expect(source, contains(\"live_chat_room_core_screen.dart\"));
    expect(source, contains(\"live_entity_profile_screen.dart\"));
    expect(source, contains(\"live_room_context_tools.dart\"));
    expect(source, contains('LiveEntityProfileScreen('));
    expect(source, contains('showLiveRoomContextTools('));
  });
"""
          new = """  test('chat entry keeps biometric locking separate from the core room', () {
    final source = File('lib/screens/live_chat_room_screen.dart').readAsStringSync();

    expect(source, contains(\"live_chat_room_core_screen.dart\"));
    expect(source, contains('chatLockBy'));
    expect(source, contains('BiometricService.authenticate'));
    expect(source, isNot(contains('showLiveRoomContextTools(')));
  });
"""
          text = replace_once(text, old, new, 'stale chat wrapper test')
          path.write_text(text)

          # This workflow is a one-shot patch vehicle; remove it and the previous
          # one-shot presence patch so main stays clean.
          Path('.github/workflows/cache-first-realtime-hotfix.yml').unlink(missing_ok=True)
          Path('.github/workflows/presence-header-hotfix.yml').unlink(missing_ok=True)
          PY

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate mobile
        working-directory: mobile
        run: |
          flutter pub get
          dart format lib/screens/live_p0_chats_screen.dart lib/screens/live_chat_room_core_screen.dart test/p0_p1_conflict_resolution_test.dart
          flutter analyze --no-fatal-infos
          flutter test

      - name: Commit validated hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "perf(mobile): cache-first realtime with 500ms reconciliation"
          git push origin HEAD:main
