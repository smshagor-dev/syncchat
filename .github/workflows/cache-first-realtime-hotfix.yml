name: Apply Cache First Realtime Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cache-first-realtime-hotfix.yml'
      - '.github/scripts/cache_first_realtime_hotfix.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/scripts/cache_first_realtime_hotfix.py

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate mobile
        working-directory: mobile
        run: |
          flutter pub get
          dart format lib/screens/live_p0_chats_screen.dart lib/screens/live_chat_room_core_screen.dart test/p0_p1_conflict_resolution_test.dart
          flutter analyze --no-fatal-infos
          flutter test

      - name: Commit validated hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "perf(mobile): cache-first realtime with 500ms reconciliation"
          git push origin HEAD:main
