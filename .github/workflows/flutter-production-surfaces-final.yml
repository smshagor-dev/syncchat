name: Flutter Production Surfaces Final

on:
  push:
    branches: [flutter-mobile-parity]
    paths:
      - '.github/scripts/wire_flutter_production_live.py'
      - '.github/workflows/flutter-production-surfaces-final.yml'

permissions:
  contents: write

jobs:
  android-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flutter-mobile-parity
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply production wiring
        run: python3 .github/scripts/wire_flutter_production_live.py
      - name: Format
        run: dart format mobile/lib/core mobile/lib/screens/live_collection_screens.dart mobile/lib/screens/live_settings_screen.dart mobile/lib/screens/live_mobile_shell.dart
      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-infos
      - name: Test
        working-directory: mobile
        run: flutter test
      - name: Build Android debug APK
        working-directory: mobile
        run: flutter build apk --debug

  ios-validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flutter-mobile-parity
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply production wiring
        run: python3 .github/scripts/wire_flutter_production_live.py
      - name: Format
        run: dart format mobile/lib/core mobile/lib/screens/live_collection_screens.dart mobile/lib/screens/live_settings_screen.dart mobile/lib/screens/live_mobile_shell.dart
      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-infos
      - name: Build iOS without signing
        working-directory: mobile
        run: flutter build ios --debug --no-codesign

  finalize:
    needs: [android-validate, ios-validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flutter-mobile-parity
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply validated production wiring
        run: python3 .github/scripts/wire_flutter_production_live.py
      - name: Format
        run: dart format mobile/lib/core mobile/lib/screens/live_collection_screens.dart mobile/lib/screens/live_settings_screen.dart mobile/lib/screens/live_mobile_shell.dart
      - name: Refresh lockfile
        working-directory: mobile
        run: flutter pub get
      - name: Remove one-time gate
        run: |
          rm -f .github/scripts/wire_flutter_production_live.py
          rm -f .github/workflows/flutter-production-surfaces-final.yml
      - name: Commit production surfaces
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat(flutter): finish production live collections and settings"
          git push origin HEAD:flutter-mobile-parity
