name: Syncchat Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-android-debug.yml'

concurrency:
  group: syncchat-android-debug-${{ github.ref }}
  cancel-in-progress: false

jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      GRADLE_OPTS: -Dorg.gradle.vfs.watch=false -Dorg.gradle.daemon=false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build installable debug APK
        run: flutter build apk --debug

      - name: Package debug APK
        run: cp build/app/outputs/flutter-apk/app-debug.apk "$RUNNER_TEMP/Syncchat-debug.apk"

      - name: Upload Syncchat debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Syncchat-debug-apk
          path: ${{ runner.temp }}/Syncchat-debug.apk
          if-no-files-found: error
          retention-days: 14
