name: Syncchat Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-android-debug.yml'

permissions:
  contents: write

concurrency:
  group: syncchat-android-debug-${{ github.ref }}
  cancel-in-progress: false

env:
  DEBUG_RELEASE_TAG: mobile-debug-v0.1.0-5
  DEBUG_RELEASE_TITLE: SyncChat Android Debug v0.1.0+5

jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      GRADLE_OPTS: -Dorg.gradle.vfs.watch=false -Dorg.gradle.daemon=false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build installable debug APK against production API
        run: >-
          flutter build apk --debug
          --dart-define=SYNCCHAT_API_BASE_URL=https://api.syncchat.live/api
          --dart-define=SYNCCHAT_SOCKET_URL=https://api.syncchat.live
          --dart-define=SYNCCHAT_APP_VERSION=${DEBUG_RELEASE_TAG}

      - name: Package debug APK
        run: |
          mkdir -p "$RUNNER_TEMP/syncchat-debug-release"
          cp build/app/outputs/flutter-apk/app-debug.apk "$RUNNER_TEMP/syncchat-debug-release/Syncchat-debug.apk"
          sha256sum "$RUNNER_TEMP/syncchat-debug-release/Syncchat-debug.apk" > "$RUNNER_TEMP/syncchat-debug-release/Syncchat-debug.apk.sha256"

      - name: Upload Syncchat debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Syncchat-debug-apk
          path: |
            ${{ runner.temp }}/syncchat-debug-release/Syncchat-debug.apk
            ${{ runner.temp }}/syncchat-debug-release/Syncchat-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish debug GitHub prerelease
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="$RUNNER_TEMP/syncchat-debug-release/Syncchat-debug.apk"
          HASH="$RUNNER_TEMP/syncchat-debug-release/Syncchat-debug.apk.sha256"
          if gh release view "$DEBUG_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$DEBUG_RELEASE_TAG" "$APK" "$HASH" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$DEBUG_RELEASE_TAG" "$APK" "$HASH" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$DEBUG_RELEASE_TITLE" \
              --notes "Installable SyncChat Android debug build connected to https://api.syncchat.live/api and https://api.syncchat.live. Debug-signed, not intended for Google Play production distribution." \
              --prerelease
          fi
