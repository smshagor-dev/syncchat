name: Backend Stability Integration

on:
  push:
    branches:
      - backend-stability-fix

permissions:
  contents: write

jobs:
  harden-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backend-stability-fix

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Remove unused UUID dependency
        working-directory: backend
        run: npm uninstall uuid --package-lock-only --ignore-scripts

      - name: Strengthen Vercel runtime regression test
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'backend/test/vercel-runtime-compat.test.js';
          let text = fs.readFileSync(path, 'utf8');
          const marker = "backend package does not carry the unused uuid runtime dependency";
          if (!text.includes(marker)) {
            text += `\n\ntest('${marker}', () => {\n  const packageJson = JSON.parse(\n    fs.readFileSync(path.resolve(__dirname, '../package.json'), 'utf8'),\n  );\n  assert.equal(packageJson.dependencies?.uuid, undefined);\n});\n`;
            fs.writeFileSync(path, text);
          }
          NODE

      - name: Add safe Dependabot grouping
        run: |
          cat > .github/dependabot.yml <<'YAML'
          version: 2
          updates:
            - package-ecosystem: npm
              directory: "/backend"
              schedule:
                interval: weekly
              open-pull-requests-limit: 10
              groups:
                backend-minor-patch:
                  patterns:
                    - "*"
                  update-types:
                    - "minor"
                    - "patch"
          YAML

      - name: Assert backend dependency contract
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('backend/package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('backend/package-lock.json', 'utf8'));
          if (pkg.dependencies?.uuid) throw new Error(`uuid still present in package.json: ${pkg.dependencies.uuid}`);
          if (lock.packages?.['']?.dependencies?.uuid) throw new Error(`uuid still present as root lock dependency: ${lock.packages[''].dependencies.uuid}`);
          NODE

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Test backend
        working-directory: backend
        run: npm test

      - name: Audit production dependencies
        working-directory: backend
        run: npm audit --omit=dev --audit-level=critical

      - name: Remove one-time integration workflow
        run: rm .github/workflows/backend-stability-integrate.yml

      - name: Commit validated backend hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package.json backend/package-lock.json backend/test/vercel-runtime-compat.test.js .github/dependabot.yml .github/workflows/backend-stability-integrate.yml
          git diff --cached --check
          git commit -m "fix(backend): harden runtime dependency compatibility"
          git push origin HEAD:backend-stability-fix
