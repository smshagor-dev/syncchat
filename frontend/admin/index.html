<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0ea5e9" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/pwa-512x512.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>SyncChat Admin</title>
  </head>
  <body>
    <div id="admin-root"></div>
    <div id="admin-shortcuts" style="display:none;position:fixed;right:18px;bottom:18px;z-index:99999;gap:8px;flex-direction:column;align-items:flex-end">
      <a href="/admin/calling-push" style="padding:10px 14px;border-radius:12px;background:#2563eb;color:#fff;text-decoration:none;font:600 13px Arial,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.18)">Native Call Push</a>
      <a href="/admin/calling" style="padding:10px 14px;border-radius:12px;background:#0f766e;color:#fff;text-decoration:none;font:600 13px Arial,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.18)">Calling & WebRTC</a>
      <a href="/admin/storage" style="padding:10px 14px;border-radius:12px;background:#111827;color:#fff;text-decoration:none;font:600 13px Arial,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.18)">FTP Storage</a>
    </div>
    <script>
      try {
        if (localStorage.getItem('admin_token')) {
          document.getElementById('admin-shortcuts').style.display = 'flex';
        }
      } catch (error) {}
    </script>
  </body>
</html>
