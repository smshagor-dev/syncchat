name: syncchat_mobile
description: Native Flutter mobile client for SyncChat with web-client design parity.
publish_to: "none"
version: 0.1.0+4

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.8.1
  file_picker: ^10.3.10
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_callkit_incoming: ^3.1.5
  flutter_contacts: ^2.3.1
  flutter_local_notifications: ^22.3.0
  flutter_secure_storage: ^10.3.1
  flutter_webrtc: ^1.6.0
  geolocator: 14.0.2
  http: ^1.6.0
  image_picker: ^1.1.2
  livekit_client: ^2.11.0
  mobile_scanner: ^7.1.4
  path_provider: ^2.1.6
  permission_handler: ^12.0.3
  pointycastle: ^4.0.0
  record: ^7.1.1
  socket_io_client: ^3.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/syncchat_logo.png
