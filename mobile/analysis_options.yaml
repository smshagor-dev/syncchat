analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    # Contacts keeps one legacy labels helper as an audited rollback surface.
    # It is intentionally not part of the active compact messenger layout.
    unused_element: info

linter:
  rules:
    avoid_print: true
    prefer_const_constructors: true
    use_super_parameters: true
